apiVersion: v1
kind: Secret
metadata:
  name: fastpki-secret
  labels:
    app.kubernetes.io/name: fastpki
    app.kubernetes.io/instance: fastpki
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  pgPassword: "$PG_PASSWORD"
  # Generated per deployment by apply.sh when unset — never defaulted, because a
  # well-known PIN would protect every CA private key in the token.
  fastpkiPin: "$FASTPKI_PIN"
  # ⚠️ THE SO PIN RESETS THE USER PIN. A Security Officer can re-initialise the token and set
  # a new user PIN without knowing the old one, so it is not a lesser secret than fastpkiPin —
  # it is the one that can take the token away. It was a plain `value:` in the Deployment
  # spec, which envsubst filled in, putting it in reach of anyone who can read a Deployment.
  softhsmSoPin: "$SOFTHSM_SO_PIN"
