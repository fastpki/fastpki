# FastPKI bootstrap config for the docker-compose stack (deploy/docker-compose.yml).
#
# ⚠️ THIS FILE IS A BOOTSTRAP, NOT THE CONFIGURATION. Every service does:
#
#     Config::load(file)  ->  make_postgres_db(cfg.pg_conninfo)  ->  overlay_config(cfg, db)
#
# so the `config` TABLE is the source of truth and wins over anything written here. The
# console edits that table; this file exists only to get far enough to open it.
#
# ⚠️ AND THE TABLE ONLY WINS WHERE A ROW EXISTS. Deleting a key here does NOT hand it to
# the table — it hands it to the compiled-in default. So the rule for this file is:
# a key belongs here only when its value DIFFERS from the default, or when nothing can
# derive it (the conninfo, the key/cert references, the per-deployment URLs).
#
# Everything that merely restated its default has been removed; `tests/config_keys_live.sh`
# fails the build if any of it comes back. Ports, binds, paths and validity limits are all
# compiled defaults now — set them in the console, where they replicate.
#
# Per-deployment values (PKI_DNS, BASE_URL, DATACENTER_ID, CMP_CLIENT_CA_ID) belong in the
# untracked deploy/.env, not here: this file is git-tracked and shared by every node.

# --- Database: the one value that has to be in a file --------------------------
# app<->DB is TLS: verify-full against the transport cert certgen generates at deploy time
# (its SAN covers the compose service name `postgres`).
#
# ⚠️ target_session_attrs=read-write MATTERS EVEN WITH ONE HOST NAMED HERE, because it is
# what makes the value extend. A deployment that gains a standby on a SECOND HOST sets this
# key to name both addresses (see docs/high-availability.md), and libpq then keeps whichever of them is
# read-write — so a promotion re-homes the apps on their next reconnect with no restart.
# Drop the attribute and that upgrade path silently stops working.
PG_CONNINFO=host=postgres port=5432 dbname=fastpki user=fastpki sslmode=verify-full sslrootcert=/var/pki/tls/pg/ca.crt target_session_attrs=read-write connect_timeout=5

# --- Web console ---------------------------------------------------------------
# The bind address and the write switch used to be stated here because their compiled
# defaults were loopback and read-only. Both defaults now match what a container
# deployment needs, so the lines are gone rather than restating them.
# Console TLS: certificate from the DB (certs.cert_id='web'), private key in the token.
WEB_TLS_KEY=pkcs11:token=fastpki;object=web-tls;type=private?pin-source=/var/pki/tls/pin
WEB_CERT_ID=web

# --- OCSP ----------------------------------------------------------------------
# The CA key NEVER signs a status response: fastpki-ocsp signs with a delegated responder
# credential and refuses to answer for a CA that has none, so this key is required rather
# than optional. ONE key reference for the process, N certificates — the URI is identical
# on every node while the key OBJECT is minted inside each node's own token, and each node
# holds its own certificate under cert_id "ocsp-ra-<ca_id>" issued by the CA it serves.
# RFC 6960 4.2.2.2 requires that per-CA binding.
#
# Provision with: Inventory -> Request (key in HSM) -> Serve as OCSP responder.
OCSP_RESPONDER_KEY=pkcs11:token=fastpki;object=ocsp-ra;type=private?pin-source=/var/pki/tls/pin

# --- Transport keys for the enrolment listeners --------------------------------
# Kept explicit even though each matches its compiled default: where a deployment's private
# keys live is the last thing that should be inherited silently from a constant in the
# source. The matching certificates come from the DB by cert_id.
EST_KEY=pkcs11:token=fastpki;object=est-tls;type=private?pin-source=/var/pki/tls/pin
EST_CERT_ID=est
ACME_KEY=pkcs11:token=fastpki;object=acme-tls;type=private?pin-source=/var/pki/tls/pin
ACME_CERT_ID=acme
MS_KEY=pkcs11:token=fastpki;object=ms-tls;type=private?pin-source=/var/pki/tls/pin
MS_CERT_ID=ms
CMP_RA_KEY=pkcs11:token=fastpki;object=cmp-ra;type=private?pin-source=/var/pki/tls/pin

# ⚠️ SCEP NEEDS ITS OWN RA KEY, AND IT MUST BE RSA. A SCEP client envelopes its CSR to the
# certificate the server advertises, using RSA KEY TRANSPORT — RFC 8894 fixes that. With no
# SCEP_RA_KEY the server falls back to the CA's own key, so SCEP works only while the
# issuing CA happens to be RSA and fails against an EC or PQC one with
#     SCEP PKCSReq: could not decrypt EnvelopedData with the CA key
# which names the envelope and not the key type, and is the same message whatever the
# client did. Naming a key here is what makes `fastpki-ca renew-service-certs
# --create-missing` mint one — as RSA, because SCEP_RA_KEY_ALGO deliberately does not exist.
SCEP_RA_KEY=pkcs11:token=fastpki;object=scep-ra;type=private?pin-source=/var/pki/tls/pin

# ⚠️ CMP_CLIENT_CA_ID IS LEFT OUT ON PURPOSE, AND AN EMPTY VALUE IS NOT THE SAME THING.
# Config::load() seeds from the environment first and then applies every key it finds here,
# and the env-wins skip covers only the conninfo. So a key present with an empty value
# OVERWRITES a real value the deployment set in its environment, silently. Measured: .env
# set it, this file erased it, the trust store ended with 0 anchors, and CMP refused every
# signature-protected request — which is why revocation over CMP quietly stopped working.
# A key with no value is not a setting; it is a comment pretending to be one.
# Uncomment and name a registered CA id to also accept a client certificate it issued:
# CMP_CLIENT_CA_ID=<registered CA id — a `certs` row with is_ca>

# --- Auth backend for EST / MS-WSTEP password auth -----------------------------
# ⚠️ EQUAL TO THE DEFAULT AND KEPT ANYWAY — `tests/auth_backend_shipped.sh` PINS this line,
# so do not delete it as redundant. Guards that check key NAMES cannot see a dangerous VALUE
# of a legitimate key; asserting the shipped value is present is what closes that gap.
AUTH_BACKEND=local

# --- URLs baked into issued certificates ---------------------------------------
# Per-deployment: these must resolve to THIS PKI. Set PKI_DNS in deploy/.env and re-issue —
# AIA/CRLDP are baked at issuance, so anything issued earlier keeps the old host.
CRL_DPS=http://localhost:8080/pki/signing_ca.crl
AIA_CA_ISSUERS=http://localhost:8080/pki/signing_ca.crt
AIA_OCSP=http://localhost:8080/ocsp/

# Differs from the default (err).
LOG_LEVEL=info

# The token the deployment initialises (the softhsm container creates it with this label) and
# the PIN file certgen.sh writes. Together they let the console offer a slot picker and
# derive `pkcs11:token=<PKCS11_TOKEN>;object=<id>;type=private` itself, so an operator never
# types PKCS#11 URI syntax. The PIN is a PATH, never the value: a PIN in the config is a PIN
# in every backup and every `docker inspect`.
PKCS11_TOKEN=fastpki
PKCS11_PIN_FILE=/var/pki/tls/pin
