# The enrolment protocols, each across every server — the one address a pair advertises, which is
# also the address every certificate's AIA and CRL DP name. A client never learns which pod
# answered, so losing one changes nothing it can see.
#
# ⚠️ NOT A TLS-TERMINATING INGRESS. EST and CMP authenticate the client with its certificate, and
# a proxy that terminates TLS destroys the thing being verified. LoadBalancer and NodePort pass
# the connection through intact; PROTO_SERVICE_TYPE chooses between them (docs/deployment.md §8.6).
apiVersion: v1
kind: Service
metadata:
  name: fastpki-ocsp
  labels: { app.kubernetes.io/name: fastpki, app.kubernetes.io/instance: fastpki, app.kubernetes.io/component: ocsp }
spec:
  type: $PROTO_SERVICE_TYPE
  selector: { app.kubernetes.io/name: fastpki, app.kubernetes.io/instance: fastpki, app.kubernetes.io/component: node }
  ports:
    - { port: 8080, targetPort: 8080, protocol: TCP }
---
